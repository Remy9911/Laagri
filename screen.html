<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laagri Karts</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="screen.css">
  <script src="https://www.airconsole.com/api/airconsole-1.11.0.js"></script>
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>

    <div id="hud" class="hidden">
      <div id="clockBox" class="glass"><div id="clock">3:00</div><div id="heatNo">HEAT 1</div></div>
      <div id="standings" class="glass"></div>
      <canvas id="minimap" class="glass"></canvas>
      <div id="street" class="glass hidden"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.6A2.6 2.6 0 1 1 12 6.4a2.6 2.6 0 0 1 0 5.2z" fill="currentColor"/></svg><div><div id="streetName"></div><div class="sub">Laagri · Saue vald</div></div></div>
      <div id="attrib">Ortofoto © Maa- ja Ruumiamet · © OpenStreetMap contributors</div>
    </div>
    <div id="count"></div>
    <div id="banner"><div id="bannerTop"></div><div id="bannerMain"></div></div>
    <div id="toasts"></div>

    <div id="overlay"><div id="panel" class="glass"></div></div>

    <button id="soundBtn" class="hidden" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19.5 5.5a9 9 0 0 1 0 13"/></svg><span>Click to turn on sound</span></button>
  </div>

  <script src="common.js"></script>
  <script src="laagri-data.js"></script>
  <script src="sound.js"></script>
  <script src="screen.js"></script>
</body>
</html>
